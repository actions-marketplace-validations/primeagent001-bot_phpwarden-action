name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches CLI/feed regressions against the fixtures

permissions:
  contents: read

jobs:
  vulnerable-fixture:
    name: flags a vulnerable composer.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the action against the outdated fixture
        id: scan
        uses: ./
        with:
          composer-lock: tests/fixtures/composer.lock
          reachability: "false"
          fail-on: never
      - name: Assert findings
        shell: bash
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
          WORST: ${{ steps.scan.outputs.worst-severity }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -e
          test "$FINDINGS" -gt 0
          test "$WORST" = high -o "$WORST" = critical
          python3 - "$SARIF" <<'EOF'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["version"] == "2.1.0"
          run = doc["runs"][0]
          assert run["tool"]["driver"]["name"] == "phpwarden"
          assert run["results"], "no SARIF results"
          assert all(r["locations"][0]["physicalLocation"]["region"]["startLine"] > 1 for r in run["results"]), "line lookup failed"
          print(f"SARIF ok: {len(run['results'])} results, {len(run['tool']['driver']['rules'])} rules")
          EOF

  fail-policy:
    name: fail-on policy blocks the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          composer-lock: tests/fixtures/composer.lock
          reachability: "false"
          fail-on: high
      - name: The step above must have failed
        run: test "${{ steps.scan.outcome }}" = failure

  clean-fixture:
    name: passes a clean composer.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: scan
        uses: ./
        with:
          composer-lock: tests/fixtures/clean/composer.lock
          reachability: "false"
      - run: test "${{ steps.scan.outputs.findings }}" = 0

  engine-scan:
    name: assesses a PHP engine version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: scan
        uses: ./
        with:
          composer-lock: ""
          php-version: "8.1.0"
          fail-on: never
      - run: test "${{ steps.scan.outputs.exploited }}" -gt 0
